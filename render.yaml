services:
  - type: web
    name: bebragram
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: bebragram-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_NAME
        value: bebragram_token
      - key: APP_URL
        fromService:
          type: web
          name: bebragram
          property: host

databases:
  - name: bebragram-db
    plan: free
