<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Бебраграмм</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar glass">
        <div class="brand-block">
          <div class="brand-icon">🦫</div>
          <div>
            <h1>Бебраграмм</h1>
            <p>чат для серьёзных бобров</p>
          </div>
        </div>

        <label class="search-box">
          <span>🔎</span>
          <input id="searchInput" type="text" placeholder="Поиск по плотинам" />
        </label>

        <div id="chatList" class="chat-list"></div>

        <div class="sidebar-footer">
          <div class="mini-card">
            <span class="mini-emoji">🌲</span>
            <div>
              <strong>SSE вместо ws</strong>
              <small>подходит для Render</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="chat-panel glass">
        <header class="chat-header">
          <div class="chat-header-main">
            <div id="chatEmoji" class="chat-badge">🪵</div>
            <div>
              <h2 id="chatTitle">Плотинщики</h2>
              <p id="chatSubtitle">Главный штаб бобров</p>
            </div>
          </div>
          <button id="themeBtn" class="ghost-btn" type="button">Перекусить корой</button>
        </header>

        <section id="messages" class="messages"></section>

        <footer class="composer-wrap">
          <form id="composer" class="composer">
            <button class="composer-addon" type="button" aria-label="Стикеры">🪵</button>
            <input id="messageInput" type="text" placeholder="Напиши что-нибудь по-бобриному..." maxlength="1000" autocomplete="off" />
            <button class="send-btn" type="submit">Отправить</button>
          </form>
        </footer>
      </main>
    </div>

    <template id="chatItemTemplate">
      <button class="chat-item" type="button">
        <div class="chat-item-icon"></div>
        <div class="chat-item-main">
          <div class="chat-item-top">
            <strong class="chat-item-title"></strong>
            <span class="chat-item-time"></span>
          </div>
          <div class="chat-item-bottom">
            <span class="chat-item-subtitle"></span>
            <span class="chat-item-members"></span>
          </div>
        </div>
      </button>
    </template>

    <template id="messageTemplate">
      <article class="message-row">
        <div class="avatar"></div>
        <div class="bubble">
          <div class="bubble-head">
            <strong class="author"></strong>
            <time class="time"></time>
          </div>
          <p class="text"></p>
        </div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
